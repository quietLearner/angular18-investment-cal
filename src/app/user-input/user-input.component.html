<form (ngSubmit)="onSubmit()" #calForm="ngForm">
  <div class="input-group">
    <p>
      <label for="initial-investment">Initial Investment</label>
      <input
        type="number"
        id="initial-investment"
        name="initialInvestment"
        [(ngModel)]="initialInvestment"
        required
      />
    </p>
    <p>
      <label for="annual-investment">Annual Investment</label>
      <input
        type="number"
        id="annual-investment"
        name="annualInvestment"
        [(ngModel)]="annualInvestment"
        required
      />
    </p>
  </div>
  <div class="input-group">
    <p>
      <label for="expected-return">Expected Return (%)</label>
      <input
        type="number"
        id="expected-return"
        name="expectedReturn"
        [(ngModel)]="expectedReturn"
        required
      />
    </p>
    <p>
      <label for="duration">Duration (years)</label>
      <input
        type="number"
        id="duration"
        name="duration"
        [(ngModel)]="duration"
        required
      />
    </p>
  </div>
  <p>
    <button type="submit" [disabled]="calForm.invalid">Calculate</button>
  </p>
</form>
